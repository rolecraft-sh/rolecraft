name: Docs sync

# Generated values in the markdown docs (test_count, unpacked_size, package_size
# and the agent counts) change on nearly every merge. Feature branches
# deliberately do not carry them — requiring them to made every open PR stale by
# definition, so MAINIFEST-MATRIX.md, README.md, CONTRIBUTING.md,
# benchmark/RESULTS.md and four docs/*.md conflicted on each merge.
#
# Instead, main owns them: this workflow recomputes after every merge and opens a
# PR with the result. src/agents/manifest.test.js asserts the values are exact
# on main and only asserts structure elsewhere, so a hand-mangled value still
# fails a contributor's PR while "main moved since you branched" does not.
#
# It has to be a PR rather than a direct push. main is protected with strict
# status checks, so a commit pushed straight to main is rejected with GH006 —
# it has no CI run to satisfy the required contexts. Going through a PR means the
# regenerated values get tested like any other change, and protection is intact.
#
# A PAT rather than GITHUB_TOKEN, because commits pushed with GITHUB_TOKEN do
# not trigger workflow runs — the PR would sit with no checks and never merge.
# release-prep.yml already uses this same secret, so this is the established
# pattern in this repo rather than a new dependency.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never race two runs: if two merges land in quick succession, let the newer run
# win instead of opening two PRs for the same state.
concurrency:
  group: docs-sync-main
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate docs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Regenerate docs and manifest matrix
        run: npm run --silent generate:docs

      - name: Open PR if changed
        env:
          BRANCH: docs/regenerate-${{ github.run_number }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Generated values already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: regenerate docs and manifest matrix"

          # Deliberately NOT "changelog/…" — release-publish.yml publishes to npm
          # for any merged PR whose head ref starts with that prefix. A generated
          # values refresh must never be able to trigger a release.
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: regenerate docs and manifest matrix" \
            --body "Automated refresh of the manifest-derived values in the docs (\`test_count\`, \`unpacked_size\`, and the agent counts).

          Opened by \`.github/workflows/docs-sync.yml\` because those values changed on the merge of ${{ github.event.head_commit.id }}.

          No source files are touched. This PR exists only because \`main\` is protected: a direct push of regenerated values is rejected with GH006, since it carries no CI run to satisfy the required status checks. The PR routes the change through the same gate as everything else."

          # main requires status checks but no review, so once the matrix passes
          # this PR is mergeable unattended. Needs the repository's
          # "Allow auto-merge" setting, which is enabled.
          gh pr merge --squash --auto || {
            echo "::warning::auto-merge could not be enabled; this PR needs a manual merge"
          }