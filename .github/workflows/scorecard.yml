name: Scorecard

on:
  # Fires when branch protection changes. Without this, adding or editing a
  # workflow would edit branch protection, which would retrigger this workflow
  # and loop forever.
  #
  # There is no `ruleset` trigger — it exists as a webhook event but not as a
  # workflow trigger, and an unknown event name makes the whole workflow file
  # invalid. Ruleset edits do not fire branch_protection_rule either, so after
  # changing a ruleset, re-run Scorecard from the Actions tab.
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      # The action fails the job when a single GraphQL query 504s from the
      # GitHub API (`ListCommits: ... 504 Gateway Timeout`). That is our
      # infrastructure, not a finding about the repository, and this workflow
      # runs on every push to main — so a transient blip would otherwise show a
      # red check on an otherwise clean commit.
      #
      # A failed attempt is tolerated and retried once. The retry only tolerates
      # the "could not reach the API" class of error; if the second attempt
      # produces findings or a different failure, the step still fails, so a
      # real result can never be swallowed. `publish_results` is off on the
      # first attempt so a retry never uploads SARIF twice.
      - name: Run analysis
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Retry after a transient API error
        if: steps.scorecard.outcome != 'success'
        run: |
          echo "::notice::Scorecard did not complete, retrying once in case the GitHub API timed out."
          sleep 45

      # No `continue-on-error` here: if the retry also fails, that is a real
      # failure and the job goes red rather than reporting an empty pass.
      - name: Re-run analysis
        id: scorecard_retry
        if: steps.scorecard.outcome != 'success'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scorecard-results
          path: results.sarif
          retention-days: 5