name: Scorecard

on:
  # Fires when branch protection changes. Without this, adding or editing a
  # workflow would edit branch protection, which would retrigger this workflow
  # and loop forever.
  #
  # There is no `ruleset` trigger — it exists as a webhook event but not as a
  # workflow trigger, and an unknown event name makes the whole workflow file
  # invalid. Ruleset edits do not fire branch_protection_rule either, so after
  # changing a ruleset, re-run Scorecard from the Actions tab.
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: Scorecard-results
          path: results.sarif
          retention-days: 5