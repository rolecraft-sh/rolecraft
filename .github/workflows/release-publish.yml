name: Release Publish

on:
  workflow_dispatch:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'changelog/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Re-running this workflow must not fail on an already-published version.
      # v2.6.1 published fine but the attestation failed on a missing permission,
      # leaving the GitHub Release uncreated; a manual re-run skips the publish
      # and completes the remaining steps.
      - name: Check if version is already published
        id: published
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if npm view "rolecraft@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm provenance (package.json publishConfig.provenance) already covers
      # the registry-side attestation. This adds the GitHub-side attestation so
      # the release is verifiable with `gh attestation verify` and appears in
      # the repo's artifact list, not only in the npm registry.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package.json

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          # Extract the changelog section for this version
          awk -v tag="$TAG" '
            /^## \[/ { in_section = ($0 ~ "\\[" tag "\\]") }
            in_section { print }
          ' CHANGELOG.md > /tmp/changelog.md
          # Check if we got content
          if [ ! -s /tmp/changelog.md ]; then
            echo "No changelog found for version $VERSION"
            echo "changelog=No changelog available" >> $GITHUB_OUTPUT
          else
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/changelog.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.changelog.outputs.changelog != 'No changelog available'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            echo "Creating GitHub Release for $TAG"
            gh release create "$TAG" \
              --verify-tag \
              --title "Release $TAG" \
              --notes-file /tmp/changelog.md \
              --latest=false
          fi