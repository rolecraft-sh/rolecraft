name: Release Publish

on:
  workflow_dispatch:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'changelog/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Re-running this workflow must not fail on an already-published version.
      # v2.6.1 published fine but the attestation failed on a missing permission,
      # leaving the GitHub Release uncreated; a manual re-run skips the publish
      # and completes the remaining steps.
      - name: Check if version is already published
        id: published
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if npm view "rolecraft@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm provenance (package.json publishConfig.provenance) already covers
      # the registry-side attestation. This adds the GitHub-side attestation so
      # the release is verifiable with `gh attestation verify` and appears in
      # the repo's artifact list, not only in the npm registry.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package.json

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          # Extract the changelog section for this version
          awk -v tag="$TAG" '
            /^## \[/ { in_section = ($0 ~ "\\[" tag "\\]") }
            in_section { print }
          ' CHANGELOG.md > /tmp/changelog.md
          # Check if we got content
          if [ ! -s /tmp/changelog.md ]; then
            echo "No changelog found for version $VERSION"
            echo "changelog=No changelog available" >> $GITHUB_OUTPUT
          else
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/changelog.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.changelog.outputs.changelog != 'No changelog available'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            echo "Creating GitHub Release for $TAG"
            gh release create "$TAG" \
              --verify-tag \
              --title "Release $TAG" \
              --notes-file /tmp/changelog.md \
              --latest=false
          fi

  # Keeps the Homebrew formula in sametcelikbicak/homebrew-tap on the same
  # version as the npm package and the GitHub release.
  update-tap:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4cabbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v$VERSION"

          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN is not configured - skipping the tap update"
            exit 0
          fi

          # Only a published release may update the formula.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist - skipping the tap update"
            exit 0
          fi

          # The npm registry can lag a few seconds behind the publish.
          SHA="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "https://registry.npmjs.org/rolecraft/-/rolecraft-$VERSION.tgz" | shasum -a 256 | awk '{print $1}')"
          echo "rolecraft $VERSION sha256: $SHA"

          git clone "https://sametcelikbicak:${TAP_TOKEN}@github.com/sametcelikbicak/homebrew-tap.git" tap
          cd tap
          sed -i "s|url \".*\"|url \"https://registry.npmjs.org/rolecraft/-/rolecraft-$VERSION.tgz\"|" Formula/rolecraft.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/rolecraft.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rolecraft.rb
          if git diff --cached --quiet; then
            echo "Formula is already up to date"
            exit 0
          fi
          git commit -m "rolecraft $VERSION"
          git pull --rebase origin main
          git push
