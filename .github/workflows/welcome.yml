name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    # Only greet real first-time contributors. Dependabot and other automation
    # open issues and PRs constantly and do not need to be welcomed, and the
    # maintainer opening their own issue should not be greeted either.
    #
    # The two triggers carry the author under different keys (`issue` for
    # `issues`, `pull_request` for `pull_request_target`), so both are checked.
    if: >-
      github.actor != 'sametcelikbicak' &&
      !endsWith(github.actor, '[bot]') &&
      (
        github.event_name == 'issues' &&
        github.event.issue.user.login == github.actor ||
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.user.login == github.actor
      )
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            👋 Thanks for opening your first issue in RoleCraft!

            A maintainer will take a look shortly — clear repro steps and expected behavior make reviews much faster.
          pr_message: |
            🎉 Thanks for opening your first pull request in RoleCraft!

            A maintainer will review it soon — it helps if `npm run lint` and `npm test` pass locally.
