name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing job must not cancel the rest. A Node test-runner bug that
      # hits a single matrix leg would otherwise mark every leg red and hide which
      # one actually failed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 24 is the oldest line tested, and the current LTS.
        # 26 is Current and becomes LTS on 2026-10-28, so testing it now is how
        # we find breakage before it becomes the recommended line.
        #
        # Node 22 and 20 are deliberately absent, and this is not a support
        # statement: package.json still declares `node: >=22`, so users on 22
        # are supported and the CLI runs there fine. What breaks on 22 is our
        # own test harness, not our code - nodejs/node#64061 intermittently
        # kills `node --test` with "Unable to deserialize cloned data" and
        # reports a fully passing file as failed. The fix (nodejs/node#64706)
        # shipped in v24.x and was never backported to v22.x.
        #
        # Testing it anyway would mean a check that cannot be trusted: a red
        # that blocks merges when it happens, and a red that teaches reviewers
        # to ignore reds when it does not. Add 22 back once v22.x carries
        # #64706.
        node-version: [24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run npm audit
        if: matrix.node-version == 24
        run: |
          npm i --package-lock-only
          npm audit --audit-level=high
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        if: matrix.node-version == 24
        run: npm run lint

      - name: Run tests
        run: node --test --test-concurrency=1

      # release-prep.sh rewrites CHANGELOG.md and package.json for every release,
      # and until now it only ever ran after a signed tag was pushed, so a bug in
      # it surfaced as a broken release instead of a failing check (#369). It
      # needs its own step because node --test skips dot-directories, so the
      # fixture cannot live under src/ and still be discovered.
      #
      # Gated to Node 24 so it runs on both ubuntu-latest and macos-latest: the
      # script leans on sed/grep, and those differ between GNU and BSD
      # userlands. A single-OS run would not catch that class of bug.
      - name: Test release-prep script
        if: matrix.node-version == 24
        run: node --test .github/scripts/release-prep.test.js

      - name: Run test coverage
        if: matrix.node-version == 24
        run: npm run test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Upload coverage report
        if: ${{ always() && matrix.node-version == 24 }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-output.txt
          retention-days: 7

      - name: Coverage summary
        if: ${{ always() && matrix.node-version == 24 }}
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-output.txt ]; then
            # Extract the all files summary line
            COVERAGE_LINE=$(grep '^ℹ all files' coverage-output.txt | tail -1)
            if [ -n "$COVERAGE_LINE" ]; then
              echo "$COVERAGE_LINE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Full coverage report available in the **coverage-report** artifact." >> $GITHUB_STEP_SUMMARY
            else
              echo "Coverage data not found in output." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No coverage output file found." >> $GITHUB_STEP_SUMMARY
          fi
