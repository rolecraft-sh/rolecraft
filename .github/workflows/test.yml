name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Floor is 22 (see package.json engines), so 22 is the oldest line we
        # test. Node 20 is gone: EOL 2026-04-30, and its test runner has an
        # unfixed deserialization bug (nodejs/node#64061) that fails macOS
        # jobs regardless of the code under test — the fix landed in v24.20.0
        # (#64706) and v20 would never receive it.
        # 24 is the current LTS and the reference line for the extra jobs
        # below. 26 is Current and becomes LTS on 2026-10-28, so testing it
        # now is how we find breakage before it becomes the recommended line.
        node-version: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run npm audit
        if: matrix.node-version == 24
        run: |
          npm i --package-lock-only
          npm audit --audit-level=high
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        if: matrix.node-version == 24
        run: npm run lint

      - name: Run tests
        run: node --test --test-concurrency=1

      # release-prep.sh rewrites CHANGELOG.md and package.json for every release,
      # and until now it only ever ran after a signed tag was pushed, so a bug in
      # it surfaced as a broken release instead of a failing check (#369). It
      # needs its own step because node --test skips dot-directories, so the
      # fixture cannot live under src/ and still be discovered.
      #
      # Gated to Node 24 so it runs on both ubuntu-latest and macos-latest: the
      # script leans on sed/grep, and those differ between GNU and BSD
      # userlands. A single-OS run would not catch that class of bug.
      - name: Test release-prep script
        if: matrix.node-version == 24
        run: node --test .github/scripts/release-prep.test.js

      - name: Run test coverage
        if: matrix.node-version == 24
        run: npm run test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Upload coverage report
        if: ${{ always() && matrix.node-version == 24 }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-output.txt
          retention-days: 7

      - name: Coverage summary
        if: ${{ always() && matrix.node-version == 24 }}
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-output.txt ]; then
            # Extract the all files summary line
            COVERAGE_LINE=$(grep '^ℹ all files' coverage-output.txt | tail -1)
            if [ -n "$COVERAGE_LINE" ]; then
              echo "$COVERAGE_LINE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Full coverage report available in the **coverage-report** artifact." >> $GITHUB_STEP_SUMMARY
            else
              echo "Coverage data not found in output." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No coverage output file found." >> $GITHUB_STEP_SUMMARY
          fi
