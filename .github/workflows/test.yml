name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Node 20 reached EOL on 2026-04-30 and its test runner has an
        # unfixed deserialization bug (nodejs/node#64061) that fails
        # macOS jobs regardless of the code under test. The fix landed in
        # v24.20.0 (#64706); the v22 backport is pending (#65807) and v20
        # will never receive one, so testing it only buys a flaky job.
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run npm audit
        if: matrix.node-version == 24
        run: |
          npm i --package-lock-only
          npm audit --audit-level=high
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        if: matrix.node-version == 24
        run: npm run lint

      - name: Run tests
        run: node --test --test-concurrency=1

      - name: Run test coverage
        if: matrix.node-version == 24
        run: npm run test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Upload coverage report
        if: ${{ always() && matrix.node-version == 24 }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-output.txt
          retention-days: 7

      - name: Coverage summary
        if: ${{ always() && matrix.node-version == 24 }}
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-output.txt ]; then
            # Extract the all files summary line
            COVERAGE_LINE=$(grep '^ℹ all files' coverage-output.txt | tail -1)
            if [ -n "$COVERAGE_LINE" ]; then
              echo "$COVERAGE_LINE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Full coverage report available in the **coverage-report** artifact." >> $GITHUB_STEP_SUMMARY
            else
              echo "Coverage data not found in output." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No coverage output file found." >> $GITHUB_STEP_SUMMARY
          fi
