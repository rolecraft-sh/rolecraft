name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run npm audit
        run: |
          npm i --package-lock-only
          npm audit --audit-level=high
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: node --test --test-concurrency=1

      - name: Run test coverage
        run: npm run test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-output.txt
          retention-days: 7

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-output.txt ]; then
            # Extract the all files summary line
            COVERAGE_LINE=$(grep '^ℹ all files' coverage-output.txt | tail -1)
            if [ -n "$COVERAGE_LINE" ]; then
              echo "$COVERAGE_LINE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Full coverage report available in the **coverage-report** artifact." >> $GITHUB_STEP_SUMMARY
            else
              echo "Coverage data not found in output." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No coverage output file found." >> $GITHUB_STEP_SUMMARY
          fi
